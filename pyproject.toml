[project]
name = "brain-tumor-detection"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "W293",  # whitespace in blank lines inside multi-line strings (CSS/HTML)
    "B008",  # function call in default argument (FastAPI pattern with File/Depends)
    "B905",  # zip without strict (not needed for Python 3.10 compatibility)
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
